name: Build LDtk
on:
  push:
    branches:
      - '**'
    tags:
      - v**
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:

  check-commits:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      release_name: ${{ steps.check.outputs.release_name }}
      is_tag: ${{ steps.check.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent commits and set outputs
        id: check
        run: |
          # Check if this is a tag push
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "release_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Tag push detected: $TAG_NAME"
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            # For regular pushes and PRs, always build but don't create releases
            echo "should_build=true" >> $GITHUB_OUTPUT
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

  build-ldtk-mac:
    needs: check-commits
    if: needs.check-commits.outputs.should_build == 'true'
    strategy:
      matrix:
        os: [macos-14]
        haxe: [4.3.7]
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
      # Checkout, install haxe and libs
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe }}

      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      # Node/NPM commands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd app && npm install
      - run: cd app && npm run pack-prepare
      - run: cd app && CSC_IDENTITY_AUTO_DISCOVERY=false npm run pack-macos

      # Upload
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: mac-distribution
          path: app/redist/LDtk**installer.dmg

  build-ldtk-windows:
    needs: check-commits
    if: needs.check-commits.outputs.should_build == 'true'
    strategy:
      matrix:
        os: [windows-2022]
        haxe: [4.3.7]
      fail-fast: true
    runs-on: ${{ matrix.os }}

    steps:
      # Checkout & install haxe
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe }}

      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      # Node/NPM commands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd app && npm install
      - run: cd app && npm run pack-win -- --publish never

      # Upload
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: windows-distribution
          path: app/redist/LDtk**.exe

  build-ldtk-linux:
    needs: check-commits
    if: needs.check-commits.outputs.should_build == 'true'
    strategy:
      matrix:
        include:
          - os: "ubuntu-22.04"
            arch: "x86_64"
            haxe: "4.3.7"
          - os: "ubuntu-22.04"
            arch: "arm64"
            haxe: "4.3.7"
    runs-on: ${{ matrix.os }}

    steps:
      # Checkout, install haxe and libs
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ matrix.haxe }}

      # Snapcraft required for ARM build
      - name: Install Snapcraft
        if: matrix.arch == 'arm64'
        uses: samuelmeuli/action-snapcraft@v1

      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      # Node/NPM commands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd app && npm install
      - run: cd app && npm run pack-linux-${{ matrix.arch }}

      # Upload
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: linux-${{ matrix.arch }}-distribution
          path: app/redist/LDtk**installer.AppImage

  create-release:
    needs: [check-commits, build-ldtk-mac, build-ldtk-windows, build-ldtk-linux]
    if: needs.check-commits.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Move and rename files for clarity
          if [ -d "artifacts/mac-distribution" ]; then
            mv artifacts/mac-distribution/*.dmg "release-assets/LDtk-${{ needs.check-commits.outputs.release_name }}-macos.dmg" || true
          fi
          
          if [ -d "artifacts/windows-distribution" ]; then
            mv artifacts/windows-distribution/*.exe "release-assets/LDtk-${{ needs.check-commits.outputs.release_name }}-windows.exe" || true
          fi
          
          if [ -d "artifacts/linux-x86_64-distribution" ]; then
            mv artifacts/linux-x86_64-distribution/*.AppImage "release-assets/LDtk-${{ needs.check-commits.outputs.release_name }}-linux-x86_64.AppImage" || true
          fi
          
          if [ -d "artifacts/linux-arm64-distribution" ]; then
            mv artifacts/linux-arm64-distribution/*.AppImage "release-assets/LDtk-${{ needs.check-commits.outputs.release_name }}-linux-arm64.AppImage" || true
          fi
          
          ls -la release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          # For tag releases, use a more formal release note
          TAG_NAME="${{ needs.check-commits.outputs.release_name }}"
          echo "RELEASE_TITLE=LDtk $TAG_NAME" >> $GITHUB_ENV
          echo "IS_PRERELEASE=false" >> $GITHUB_ENV

          cat << EOF > release_notes.md
          # LDtk $TAG_NAME

          ## Downloads
          - **Windows**: LDtk-$TAG_NAME-windows.exe
          - **macOS**: LDtk-$TAG_NAME-macos.dmg
          - **Linux x86_64**: LDtk-$TAG_NAME-linux-x86_64.AppImage
          - **Linux ARM64**: LDtk-$TAG_NAME-linux-arm64.AppImage

          ## Recent Changes
          $(git log --pretty=format:"- %s (%h)" --since="7 days ago" | head -20)

          ---
          *Built on $(date -u +"%Y-%m-%d %H:%M UTC")*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-commits.outputs.release_name }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE }}
          files: release-assets/*
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}