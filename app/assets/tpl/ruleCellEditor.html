<h3>Cell conditions</h3>

<div class="help">
	<p><strong>Required:</strong> the cell must contain one of the checked values.</p>
	<p><strong>Forbidden:</strong> the cell must contain none of the checked values.</p>
</div>

<div class="summary"></div>
<div class="warning"></div>

<ul class="conditions">
	<li class="header">
		<span class="swatch"></span>
		<span class="name"></span>
		<span class="col">Required</span>
		<span class="col">Forbidden</span>
	</li>
</ul>

<button class="clear red"> <span class="icon delete"></span> Clear cell </button>
