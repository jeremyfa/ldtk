<dl class="form">

	<dt> <label>Random tile flip</label> </dt>
	<dd class="randomFlips">
		<label title="Randomly mirror the rendered tile(s) horizontally. This does NOT affect the pattern matching (see the X option in the rule row for that).">
			<input id="randomFlipX" type="checkbox" tabindex="1"/>
			Flip X
		</label>
		<label title="Randomly mirror the rendered tile(s) vertically. This does NOT affect the pattern matching (see the Y option in the rule row for that).">
			<input id="randomFlipY" type="checkbox" tabindex="1"/>
			Flip Y
		</label>
	</dd>


	<dt> <label for="xOffset">Tile X offset</label> </dt>
	<dd>
		<input id="xOffset" type="text" tabindex="1"/>
		<span>px</span>
		<button class="transparent small reset"> <span class="icon delete"></span> </button>
	</dd>


	<dt> <label for="yOffset">Tile Y offset</label> </dt>
	<dd>
		<input id="yOffset" type="text" tabindex="1"/>
		<span>px</span>
		<button class="transparent small reset"> <span class="icon delete"></span> </button>
	</dd>


	<dt> <label for="xMin">Tile random X offset</label> </dt>
	<dd>
		<span>min=</span>
		<input id="xMin" type="text" tabindex="1"/>
		<span>px,</span>
		<button class="transparent link"> <span class="icon orange link"></span> </button>
		<span>max=</span>
		<input id="xMax" type="text" tabindex="1"/>
		<span>px</span>
		<button class="transparent small reset"> <span class="icon delete"></span> </button>
	</dd>


	<dt> <label for="yMin">Tile random Y offset</label> </dt>
	<dd>
		<span>min=</span>
		<input id="yMin" type="text" tabindex="1"/>
		<span>px,</span>
		<button class="transparent link"> <span class="icon orange link"></span> </button>
		<span>max=</span>
		<input id="yMax" type="text" tabindex="1"/>
		<span>px</span>
		<button class="transparent small reset"> <span class="icon delete"></span> </button>
	</dd>

</dl>

<button class="red resetAll"> <span class="icon delete"></span> Reset all offsets and flips </button>
